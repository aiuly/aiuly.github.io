<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧺</title>
<style>
  *{box-sizing:border-box}
  html{min-height:100%;background:#c3c3e4 url("bg.jpg") center/cover fixed}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 0}
  main{text-align:center}

  .basket{font-size:68px;line-height:1;user-select:none}
  nav{display:flex;align-items:flex-start;justify-content:center;gap:16px;margin-top:22px;height:44px}

  nav button{position:relative;margin-top:var(--o);width:var(--s);height:var(--s);flex:none;
    border:none;padding:0;cursor:pointer;border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 2px,rgba(255,255,255,0) 5px),
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 55%,rgba(255,255,255,.4) 72%,rgba(205,220,240,.55) 86%,rgba(240,210,230,.6) 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 2px 6px rgba(70,60,110,.18);
    animation:float 5s ease-in-out infinite;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  nav button:nth-child(2){animation-delay:-1.2s}
  nav button:nth-child(3){animation-delay:-2.5s}
  nav button:nth-child(4){animation-delay:-3.7s}
  nav button::after{content:"";position:absolute;inset:0;margin:auto;width:30%;height:30%;border-radius:50%;background:var(--d);opacity:.9}
  nav button:hover:not(.on){transform:translateY(-4px)}
  nav button.on{transform:translateY(-6px) scale(1.15);animation-play-state:paused}

  #list{list-style:none;margin:30px auto 0;padding:0;width:min(420px,86vw);text-align:left}
  #list li{opacity:0;transform:translateY(4px);animation:in .35s ease forwards}
  #list a{display:block;padding:12px 2px;border-bottom:1px solid rgba(60,50,100,.12);
    color:#36324a;text-decoration:none;font:15px/1.4 Georgia,"Times New Roman",serif}
  #list a:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  #list .u{display:block;font:11px/1.4 ui-monospace,Menlo,monospace;color:#625d78;margin-top:2px}
  #list a.plain{cursor:default}
  #list a.plain:hover .t{text-decoration:none}
  #list li.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  #list li.pics img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
    box-shadow:0 4px 14px rgba(60,50,100,.15)}

  #list li.h{font:15px/1.4 Georgia,serif;color:#555064;padding:14px 2px 0}
  @keyframes in{to{opacity:1;transform:none}}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -2px}}
  @media (prefers-reduced-motion:reduce){nav button{animation:none}}
</style>
</head>
<body>
<main>
  <div class="basket" aria-hidden="true">🧺</div>
  <nav>
    <button style="--d:#c99a92;--s:26px;--o:0px" data-k="reading" aria-label="reading"></button>
    <button style="--d:#d4bc84;--s:21px;--o:12px" data-k="film" aria-label="film"></button>
    <button style="--d:#9fae92;--s:24px;--o:-3px" data-k="memes" aria-label="memes"></button>
  </nav>
  <ul id="list"></ul>
</main>
<script src="links.js"></script>
<script>
var list=document.getElementById('list'),btns=document.querySelectorAll('nav button');
function esc(x){return x.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
btns.forEach(function(b){b.addEventListener('click',function(){
  var open=b.classList.contains('on');
  btns.forEach(function(x){x.classList.remove('on')});
  list.innerHTML='';
  if(open)return;
  b.classList.add('on');
  var pics=null,n=0;
  (links[b.dataset.k]||[]).forEach(function(l){
    if(l.img){
      if(!pics){pics=document.createElement('li');pics.className='pics';pics.style.animationDelay=(n++*60)+'ms';list.appendChild(pics);}
      pics.insertAdjacentHTML('beforeend','<img src="'+esc(l.img)+'" alt="">');
      return;
    }
    pics=null;
    var li=document.createElement('li');li.style.animationDelay=(n++*60)+'ms';
    if(l.h){li.className='h';li.textContent=l.h;list.appendChild(li);return;}
    var sub=l.note!=null?l.note:l.u.replace(/^https?:\/\/(www\.)?/,'');
    var inner='<span class="t">'+esc(l.t)+'</span>'+(sub?'<span class="u">'+esc(sub)+'</span>':'');
    li.innerHTML=l.u?'<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+inner+'</a>':'<a class="plain">'+inner+'</a>';
    list.appendChild(li);
  });
})});
</script>
</body>
</html>
